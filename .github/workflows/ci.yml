name: meow

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check UI
        run: npm run check

      - name: Build UI
        run: npm run build

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      - name: Test core
        working-directory: src-tauri
        run: cargo test --lib

      - name: Check desktop binary
        working-directory: src-tauri
        run: cargo check --bin locosaonduh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Install packages
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test engine
        working-directory: flutter/android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: flutter
        run: flutter build apk --debug

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Build UI
        run: |
          npm ci
          npm run build

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      - name: Test core
        working-directory: src-tauri
        run: cargo test --lib

      - name: Check desktop binary
        working-directory: src-tauri
        run: cargo check --bin locosaonduh
