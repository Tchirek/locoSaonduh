name: android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          core="${tag%%-*}"
          major="${core%%.*}"
          rest="${core#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          echo "name=${core}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "Building locoSaonduh ${core} (versionCode ${code})"

      - name: Restore signing key
        working-directory: flutter
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing; an unsigned or debug-signed APK cannot upgrade existing installs."
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$KEYSTORE" | base64 --decode > .signing/locosaonduh.jks
          umask 077
          {
            echo "storeFile=../.signing/locosaonduh.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > .signing/key.properties

      - name: Build APK
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.name }}"

      - name: Name artifact
        run: |
          cp flutter/build/app/outputs/flutter-apk/app-release.apk \
             "locoSaonduh_${{ steps.version.outputs.name }}_android.apk"

      - name: Verify signature
        run: |
          set -euo pipefail
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          fi
          "$apksigner" verify --print-certs "locoSaonduh_${{ steps.version.outputs.name }}_android.apk" \
            | grep -E "Signer #1 certificate (DN|SHA-256 digest)"

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file="locoSaonduh_${{ steps.version.outputs.name }}_android.apk"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_TAG}" "${file}" --clobber --repo "${GITHUB_REPOSITORY}"
              exit 0
            fi
            sleep 10
          done
          gh release create "${RELEASE_TAG}" "${file}"             --title "locoSaonduh ${RELEASE_TAG}"             --repo "${GITHUB_REPOSITORY}"
