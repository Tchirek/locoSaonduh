[package]
name = "locosaonduh"
version = "0.1.0"
description = "Low-latency LAN audio for every speaker in the room"
authors = ["Tchirek"]
license = "MIT"
repository = "https://github.com/Tchirek/locoSaonduh"
edition = "2024"
rust-version = "1.88"

[lib]
name = "locosaonduh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
cpal = "0.18.2"
env_logger = "0.11"
hostname = "0.4"
if-addrs = "0.14"
log = "0.4"
opus-pure = "0.2.2"
rand = "0.9"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tauri = { version = "2.12.5", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[profile.dev.package.opus-pure]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
