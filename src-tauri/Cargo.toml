[package]
name = "locosaonduh"
version = "0.3.2"
description = "Low-latency LAN audio for every speaker in the room"
authors = ["Tchirek"]
license = "MIT"
repository = "https://github.com/Tchirek/locoSaonduh"
edition = "2024"
rust-version = "1.88"

[lib]
name = "locosaonduh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
cpal = "0.18.2"
env_logger = "0.11"
hostname = "0.4"
if-addrs = "0.14"
log = "0.4"
opus-pure = "0.2.2"
rand = "0.9"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[profile.dev]
debug = 0

[profile.dev.package.opus-pure]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
